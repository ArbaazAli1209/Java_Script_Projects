<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section>
            <div class="infos">
                <div class="info">
                    <h3>High Score: 
                        <span id="high-score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>Score: 
                        <span id="score">0</span>
                    </h3>
                </div>
                <div class="info">
                    <h3>Time: 
                        <span id="time">00:00</span>
                    </h3>
                </div>
            </div>
            <div class="board">
                
            </div>

            <div class="touch-controls">
                <button class="touch-btn touch-up" aria-label="Move Up" data-dir="up">&#9650;</button>
                <button class="touch-btn touch-left" aria-label="Move Left" data-dir="left">&#9664;</button>
                <button class="touch-btn touch-down" aria-label="Move Down" data-dir="down">&#9660;</button>
                <button class="touch-btn touch-right" aria-label="Move Right" data-dir="right">&#9654;</button>
            </div>
        </section>

        <div class="modal">
            <div class="start-game">
                <h3>Welcome to the Snake Game</h3>
                <button class="btn btn-start">Start Game</button>
            </div>
            <div class="game-over">
                <h3>Game Over</h3>
                <button class="btn btn-restart">Restart Game</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
